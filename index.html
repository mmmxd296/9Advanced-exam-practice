<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>End of Term · Grade 9 Advanced Mathematics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>

  <!-- Name Modal -->
  <div id="name-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Enter your name to start</h2>
      <p class="modal-subtitle">Your name will appear on certificates</p>
      <input type="text" id="student-name-input" placeholder="Your name / اسمك" autocomplete="name" dir="auto">
      <button id="start-btn" class="btn btn-primary" disabled>Start</button>
    </div>
  </div>

  <!-- Student Profile Modal (accessible from outside bottom-left) -->
  <div id="profile-modal" class="modal-overlay hidden">
    <div class="modal-card profile-modal-card">
      <div class="modal-header-row">
        <h3>👤 Student Activity & Progress</h3>
        <button class="close-btn" id="close-profile-modal">&times;</button>
      </div>
      <div id="profile-modal-content"></div>
    </div>
  </div>

  <!-- Teacher Auth Modal -->
  <div id="teacher-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="teacher-modal-title">
    <div class="modal-card teacher-auth-card">
      <div class="modal-header-row">
        <h3 id="teacher-modal-title">🔒 Teacher Portal</h3>
        <button class="close-btn" id="close-teacher-modal" type="button" aria-label="Close modal">&times;</button>
      </div>
      <p class="modal-subtitle">Instructor access · Mr. Mohamad Turkmani</p>
      
      <form id="teacher-auth-form" class="teacher-auth-form" onsubmit="return false;">
        <label for="teacher-passcode-input" class="teacher-auth-label">Enter Passcode:</label>
        <div class="teacher-passcode-wrap">
          <input 
            type="password" 
            id="teacher-passcode-input" 
            class="teacher-passcode-field" 
            placeholder="••••" 
            autocomplete="current-password" 
            inputmode="numeric" 
            maxlength="20">
          <button type="button" id="toggle-teacher-passcode" class="passcode-peek-btn" title="Toggle visibility" aria-label="Toggle password visibility">👁️</button>
        </div>
        <p id="teacher-auth-error" class="teacher-auth-error hidden">⚠️ Incorrect passcode. Please try again.</p>
        
        <div class="teacher-auth-actions">
          <button type="button" id="cancel-teacher-modal" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="submit-teacher-passcode" class="btn btn-primary">Enter Dashboard →</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Calculator Modal -->
  <div id="calc-modal" class="modal-overlay hidden">
    <div class="modal-card calc-card">
      <div class="calc-header">
        <h3>Scientific Calculator</h3>
        <button class="close-btn" id="close-calc">&times;</button>
      </div>
      <div id="calc-display" class="calc-display">0</div>
      <div id="calc-buttons" class="calc-buttons"></div>
    </div>
  </div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <script src="js/config.js"></script>
  <script src="js/questionBank.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/certificate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
